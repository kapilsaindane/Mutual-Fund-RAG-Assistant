name: Data Refresh Pipeline

on:
  schedule:
    # Run daily at 4:30 AM UTC (10:00 AM IST)
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force full refresh instead of incremental'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [ main, develop ]
    paths:
      - 'ingestion/**'
      - 'docs/phases/phase-2/**'

env:
  PYTHON_VERSION: '3.11'

jobs:
  change-detection:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      changed_urls: ${{ steps.detect.outputs.changed_urls }}
      force_refresh: ${{ steps.detect.outputs.force_refresh }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        
    - name: Detect changes
      id: detect
      run: |
        python ingestion/phase-2/2.7-refresh-health/change_detector.py \
          --force-refresh ${{ github.event.inputs.force_refresh || 'false' }} \
          --output-dir ${{ github.workspace }}/temp

  ingestion-pipeline:
    needs: change-detection
    if: needs.change-detection.outputs.has_changes == 'true' || needs.change-detection.outputs.force_refresh == 'true'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 chromadb sentence-transformers numpy
        
    - name: Run ingestion pipeline
      run: |
        python ingestion/phase-2/2.7-refresh-health/refresh_pipeline.py \
          --changed-urls "${{ needs.change-detection.outputs.changed_urls }}" \
          --force-refresh ${{ needs.change-detection.outputs.force_refresh }}
          
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: ingestion-reports-${{ github.run_number }}
        path: |
          ingestion/phase-2/*/output/*.json
          ingestion/phase-2/2.7-refresh-health/output/*.json
        retention-days: 30

  quality-gates:
    needs: [change-detection, ingestion-pipeline]
    if: needs.change-detection.outputs.has_changes == 'true' || needs.change-detection.outputs.force_refresh == 'true'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 chromadb
        
    - name: Run quality gates
      run: |
        python ingestion/phase-2/2.7-refresh-health/quality_gates.py
        
    - name: Generate health report
      run: |
        python ingestion/phase-2/2.7-refresh-health/health_checker.py
        
    - name: Upload health report
      uses: actions/upload-artifact@v3
      with:
        name: health-report-${{ github.run_number }}
        path: ingestion/phase-2/2.7-refresh-health/output/health-report-latest.json
        retention-days: 30

  notify:
    needs: [change-detection, ingestion-pipeline, quality-gates]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
    - name: Notify on success
      if: needs.ingestion-pipeline.result == 'success' && needs.quality-gates.result == 'success'
      run: |
        echo "✅ Data refresh completed successfully"
        echo "Changed URLs: ${{ needs.change-detection.outputs.changed_urls }}"
        
    - name: Notify on failure
      if: needs.ingestion-pipeline.result == 'failure' || needs.quality-gates.result == 'failure'
      run: |
        echo "❌ Data refresh failed"
        echo "Check the logs and artifacts for details"
        exit 1
